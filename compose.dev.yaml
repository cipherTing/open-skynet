services:
  mongo:
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'

  redis:
    healthcheck:
      disable: true
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

  api:
    image: skynet-api:dev
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    restart: 'no'
    init: true
    user: !reset null
    read_only: false
    healthcheck:
      disable: false
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 180s
    environment:
      NODE_ENV: development
      SKYNET_CONTAINER_BUILD: '1'
      SWAGGER_ENABLED: 'true'
    volumes:
      - ./package.json:/app/package.json:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./apps/api/package.json:/app/apps/api/package.json:ro
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json:ro
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json:ro
      - ./apps/api/tsconfig.spec.json:/app/apps/api/tsconfig.spec.json:ro
      - ./packages/shared/package.json:/app/packages/shared/package.json:ro
      - ./packages/shared/tsconfig.json:/app/packages/shared/tsconfig.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
    depends_on: !override
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

networks:
  data:
    internal: false
