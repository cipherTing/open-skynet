name: Push and verify images
description: Publish smoke-tested local images without replacing an existing different image.

inputs:
  api-local-image:
    description: Local API image reference that completed smoke.
    required: true
  api-remote-image:
    description: Docker Hub API image reference to publish.
    required: true
  web-local-image:
    description: Local Web image reference that completed smoke.
    required: true
  web-remote-image:
    description: Docker Hub Web image reference to publish.
    required: true

outputs:
  api-remote-manifest-digest:
    description: API manifest digest confirmed by Docker Hub after push.
    value: ${{ steps.push.outputs.api-remote-manifest-digest }}
  web-remote-manifest-digest:
    description: Web manifest digest confirmed by Docker Hub after push.
    value: ${{ steps.push.outputs.web-remote-manifest-digest }}

runs:
  using: composite
  steps:
    - name: Push and verify image identities
      id: push
      shell: bash
      run: |
        set -euo pipefail

        readonly DOCKER_HUB_AUTH_URL='https://auth.docker.io/token'
        readonly DOCKER_HUB_REGISTRY_URL='https://registry-1.docker.io'
        readonly DOCKER_HUB_MANIFEST_ACCEPT='application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
        readonly DIGEST_PATTERN='^sha256:[0-9a-f]{64}$'

        REMOTE_IMAGE_STATE=''
        REMOTE_CONFIG_DIGEST=''
        REMOTE_MANIFEST_DIGEST=''
        PUBLISHED_MANIFEST_DIGEST=''

        assert_digest() {
          local digest="$1"
          local name="$2"

          if [[ ! "$digest" =~ $DIGEST_PATTERN ]]; then
            echo "invalid ${name}: ${digest}" >&2
            return 1
          fi
        }

        get_local_config_digest() {
          local local_image="$1"
          local digest

          if ! digest="$(docker image inspect --format '{{.Id}}' "$local_image")"; then
            echo "failed to inspect smoke-tested local image: ${local_image}" >&2
            return 1
          fi
          digest="$(printf '%s' "$digest" | tr -d '[:space:]')"
          if ! assert_digest "$digest" 'local image config digest'; then
            return 1
          fi
          printf '%s\n' "$digest"
        }

        get_docker_hub_pull_token() {
          local repository="$1"
          local token

          if ! token="$(curl --silent --show-error --get "$DOCKER_HUB_AUTH_URL" --data-urlencode 'service=registry.docker.io' --data-urlencode "scope=repository:${repository}:pull" | jq -er '.token')"; then
            echo "failed to request Docker Hub pull token for ${repository}" >&2
            return 1
          fi
          printf '%s\n' "$token"
        }

        read_remote_image() {
          local remote_image="$1"
          local repository
          local tag
          local token
          local response_directory
          local response_body
          local response_headers
          local status

          case "$remote_image" in
            sundayting/skynet-api:* | sundayting/skynet-web:*) ;;
            *)
              echo "unsupported Docker Hub image: ${remote_image}" >&2
              return 1
              ;;
          esac

          repository="${remote_image%:*}"
          tag="${remote_image##*:}"
          token="$(get_docker_hub_pull_token "$repository")" || return 1
          response_directory="$(mktemp -d)" || {
            echo 'failed to create Docker Hub response directory' >&2
            return 1
          }
          response_body="${response_directory}/body.json"
          response_headers="${response_directory}/headers.txt"

          if ! status="$(curl --silent --show-error --dump-header "$response_headers" --output "$response_body" --write-out '%{http_code}' -H "Authorization: Bearer ${token}" -H "Accept: ${DOCKER_HUB_MANIFEST_ACCEPT}" "${DOCKER_HUB_REGISTRY_URL}/v2/${repository}/manifests/${tag}")"; then
            rm -rf "$response_directory"
            echo "failed to read Docker Hub manifest: ${remote_image}" >&2
            return 1
          fi

          REMOTE_IMAGE_STATE=''
          REMOTE_CONFIG_DIGEST=''
          REMOTE_MANIFEST_DIGEST=''
          case "$status" in
            404)
              REMOTE_IMAGE_STATE='missing'
              ;;
            200)
              if ! REMOTE_CONFIG_DIGEST="$(jq -er 'select(.manifests? | not) | .config.digest' "$response_body")"; then
                rm -rf "$response_directory"
                echo "Docker Hub image must be a single-platform manifest: ${remote_image}" >&2
                return 1
              fi
              REMOTE_MANIFEST_DIGEST="$(awk 'tolower($1) == "docker-content-digest:" { gsub("\\r", "", $2); print $2; exit }' "$response_headers")"
              rm -rf "$response_directory"
              if ! assert_digest "$REMOTE_CONFIG_DIGEST" 'remote image config digest'; then
                return 1
              fi
              if ! assert_digest "$REMOTE_MANIFEST_DIGEST" 'remote image manifest digest'; then
                return 1
              fi
              REMOTE_IMAGE_STATE='present'
              ;;
            *)
              cat "$response_body" >&2
              rm -rf "$response_directory"
              echo "Docker Hub returned HTTP ${status} for ${remote_image}" >&2
              return 1
              ;;
          esac
        }

        assert_matching_remote_or_missing() {
          local remote_image="$1"
          local local_config_digest="$2"

          read_remote_image "$remote_image" || return 1
          if [[ "$REMOTE_IMAGE_STATE" == 'present' && "$REMOTE_CONFIG_DIGEST" != "$local_config_digest" ]]; then
            echo "remote tag already exists with a different smoke identity: ${remote_image}" >&2
            return 1
          fi
        }

        publish_and_verify() {
          local local_image="$1"
          local remote_image="$2"
          local local_config_digest="$3"

          read_remote_image "$remote_image" || return 1
          if [[ "$REMOTE_IMAGE_STATE" == 'missing' ]]; then
            docker image tag "$local_image" "$remote_image"
            docker image push "$remote_image"
            read_remote_image "$remote_image" || return 1
          fi

          if [[ "$REMOTE_IMAGE_STATE" != 'present' ]]; then
            echo "Docker Hub tag was not available after publish: ${remote_image}" >&2
            return 1
          fi
          if [[ "$REMOTE_CONFIG_DIGEST" != "$local_config_digest" ]]; then
            echo "remote image config does not match smoke-tested local image: ${remote_image}" >&2
            return 1
          fi

          PUBLISHED_MANIFEST_DIGEST="$REMOTE_MANIFEST_DIGEST"
        }

        api_local_config_digest="$(get_local_config_digest "${{ inputs.api-local-image }}")" || exit 1
        web_local_config_digest="$(get_local_config_digest "${{ inputs.web-local-image }}")" || exit 1

        # 两个镜像都完成冲突预检后，才开始任何一次远端写入。
        assert_matching_remote_or_missing "${{ inputs.api-remote-image }}" "$api_local_config_digest"
        assert_matching_remote_or_missing "${{ inputs.web-remote-image }}" "$web_local_config_digest"

        publish_and_verify "${{ inputs.api-local-image }}" "${{ inputs.api-remote-image }}" "$api_local_config_digest"
        api_remote_manifest_digest="$PUBLISHED_MANIFEST_DIGEST"
        publish_and_verify "${{ inputs.web-local-image }}" "${{ inputs.web-remote-image }}" "$web_local_config_digest"
        web_remote_manifest_digest="$PUBLISHED_MANIFEST_DIGEST"

        echo "api-remote-manifest-digest=$api_remote_manifest_digest" >> "$GITHUB_OUTPUT"
        echo "web-remote-manifest-digest=$web_remote_manifest_digest" >> "$GITHUB_OUTPUT"
