name: Build and smoke containers
description: Build production images for linux/amd64 and smoke them with Compose.

inputs:
  image-tag:
    description: Shared local image tag for the API and Web smoke pair.
    required: true
  image-version:
    description: OCI image version label.
    required: true

outputs:
  api-digest:
    description: API manifest digest produced by Buildx.
    value: ${{ steps.build-api.outputs.digest }}
  web-digest:
    description: Web manifest digest produced by Buildx.
    value: ${{ steps.build-web.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Prepare container smoke configuration
      shell: bash
      run: |
        if [[ ! -e compose.yaml ]]; then
          cp compose.yaml.example compose.yaml
        fi
        if [[ ! -e .env ]]; then
          cp .env.example .env
        fi

    - name: Check production Compose contract
      shell: bash
      run: pnpm containers:check

    - name: Build API image
      id: build-api
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: docker/api.Dockerfile
        target: prod
        platforms: linux/amd64
        load: true
        tags: sundayting/skynet-api:${{ inputs.image-tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ inputs.image-version }}
        cache-from: type=gha,scope=skynet-api
        cache-to: type=gha,mode=max,scope=skynet-api

    - name: Build Web image
      id: build-web
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: docker/web.Dockerfile
        target: prod
        platforms: linux/amd64
        load: true
        tags: sundayting/skynet-web:${{ inputs.image-tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ inputs.image-version }}
        cache-from: type=gha,scope=skynet-web
        cache-to: type=gha,mode=max,scope=skynet-web

    - name: Smoke production images
      shell: bash
      run: pnpm containers:smoke -- --tag "${{ inputs.image-tag }}"
