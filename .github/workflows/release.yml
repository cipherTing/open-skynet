name: Release Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Verify tag commit is on origin/main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Define image version
        id: image
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          test "$version" != "$GITHUB_REF_NAME"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "smoke-tag=ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and smoke production images
        id: smoke
        uses: ./.github/actions/build-and-smoke
        with:
          image-tag: ${{ steps.image.outputs.smoke-tag }}
          image-version: ${{ steps.image.outputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push and verify smoke-tested images
        id: publish
        uses: ./.github/actions/push-and-verify
        with:
          api-local-image: sundayting/skynet-api:${{ steps.image.outputs.smoke-tag }}
          api-remote-image: sundayting/skynet-api:${{ steps.image.outputs.version }}
          api-build-digest: ${{ steps.smoke.outputs.api-digest }}
          web-local-image: sundayting/skynet-web:${{ steps.image.outputs.smoke-tag }}
          web-remote-image: sundayting/skynet-web:${{ steps.image.outputs.version }}
          web-build-digest: ${{ steps.smoke.outputs.web-digest }}

      - name: Write image summary
        env:
          API_BUILD_DIGEST: ${{ steps.smoke.outputs.api-digest }}
          WEB_BUILD_DIGEST: ${{ steps.smoke.outputs.web-digest }}
          API_REMOTE_DIGEST: ${{ steps.publish.outputs.api-remote-digest }}
          WEB_REMOTE_DIGEST: ${{ steps.publish.outputs.web-remote-digest }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          {
            echo '## Released container images'
            echo
            echo "- API: \`sundayting/skynet-api:${IMAGE_VERSION}\`"
            echo "- Web: \`sundayting/skynet-web:${IMAGE_VERSION}\`"
            echo "- API build digest: \`${API_BUILD_DIGEST}\`"
            echo "- Web build digest: \`${WEB_BUILD_DIGEST}\`"
            echo "- API remote digest: \`${API_REMOTE_DIGEST}\`"
            echo "- Web remote digest: \`${WEB_REMOTE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
